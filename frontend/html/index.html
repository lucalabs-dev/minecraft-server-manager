<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Manager</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .server-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .server-card-link {
            flex: 1;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .server-card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delete-server-button {
            padding: 8px 12px;
            border: 1px solid #d9534f;
            border-radius: 6px;
            background: transparent;
            color: #d9534f;
            cursor: pointer;
        }

        .delete-server-button:hover {
            background: #d9534f;
            color: white;
        }

        .delete-server-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .server-manager-message {
            margin: 12px 0;
            padding: 10px 12px;
            border-radius: 6px;
        }

        .server-manager-message.error {
            background: #fbe9e7;
            color: #a12622;
        }

        .server-manager-message.success {
            background: #e8f5e9;
            color: #256029;
        }

        .server-manager-message:empty {
            display: none;
        }

        #new-server-name {
            box-sizing: border-box;
            max-width: 100%;
        }

        .server-version {
            font-size: 0.9em;
            opacity: 0.7;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Minecraft Server Manager</h1>
        <p>Manage your Minecraft servers</p>
    </header>

    <main>
        <section id="servers">
            <h2>My Servers</h2>

            <div
                id="server-manager-message"
                class="server-manager-message"
                role="status"
                aria-live="polite"
            ></div>

            <div class="server-list" id="server-list"></div>

            <button id="add-server-button" type="button">
                + Add Server
            </button>
        </section>
    </main>

    <div id="add-server-modal" class="modal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Add Server</h2>

                <button
                    id="close-modal-button"
                    class="close-button"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>
            </div>

            <div id="server-choice" class="modal-body">
                <p class="modal-description">What do you want to do?</p>

                <button
                    id="new-server-button"
                    class="choice-button"
                    type="button"
                >
                    Create new server
                </button>

                <button
                    id="existing-server-button"
                    class="choice-button"
                    type="button"
                >
                    Select existing server
                </button>
            </div>

            <div id="new-server-form" class="modal-body" style="display: none;">
                <p class="modal-description">Create new server</p>

                <label for="new-server-name">Server name</label>
                <input
                    type="text"
                    id="new-server-name"
                    placeholder="Server name"
                    maxlength="32"
                    autocomplete="off"
                >

                <small>
                    1–32 characters. Allowed: letters, numbers, spaces, ".", "_" and "-".
                </small>

                <label for="minecraft-version">Minecraft version</label>

                <div class="version-selection">
                    <select id="minecraft-version">
                        <option value="" selected disabled>Select version</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button id="new-server-back-button" type="button">
                        Back
                    </button>

                    <button id="create-server-button" type="button">
                        Create
                    </button>
                </div>
            </div>

            <div
                id="existing-server-form"
                class="modal-body"
                style="display: none;"
            >
                <p class="modal-description">Select existing server</p>

                <label for="existing-server-name">Server name</label>
                <input
                    type="text"
                    id="existing-server-name"
                    placeholder="Server name"
                >

                <label for="server-path">Server folder</label>

                <div class="path-input">
                    <input
                        type="text"
                        id="server-path"
                        placeholder="Select server folder..."
                        readonly
                    >

                    <button id="select-folder-button" type="button">
                        Select
                    </button>
                </div>

                <div class="modal-footer">
                    <button id="existing-server-back-button" type="button">
                        Back
                    </button>

                    <button id="add-existing-server-button" type="button">
                        Add
                    </button>
                </div>
            </div>

        </div>
    </div>

<script src="/js/index.js" defer></script>

</body>

</html>
