events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /server/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /server/index.html;
        }

        location /api {
            proxy_pass http://api:3000;
        }
    }
}