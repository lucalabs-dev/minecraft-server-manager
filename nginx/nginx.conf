events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location ~ ^/server/[^/]+/properties/?$ {
            root /usr/share/nginx/html;
            try_files /server/properties/index.html =404;
        }

        location ~ ^/server/[^/]+/?$ {
            root /usr/share/nginx/html;
            try_files /server/index.html =404;
        }

        location /api {
            proxy_pass http://api:3000;
        }
    }
}