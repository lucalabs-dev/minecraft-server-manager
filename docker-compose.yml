services:
  api:
    build: ./backend/api
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
  web:
    image: nginx
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/html:/usr/share/nginx/html:ro